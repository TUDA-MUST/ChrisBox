; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:adafruit_feather_esp32s3]
platform = espressif32
board = adafruit_feather_esp32s3
framework = arduino
; lib_extra_dirs = lib
lib_deps = wollewald/ADS1220_WE@^1.0.25
monitor_speed = 115200
build_flags = 
    -D CORE_DEBUG_LEVEL=0                   ; Core Debug Level: "None"
    -D ARDUINO_RUNNING_CORE=1                ; Arduino Runs On: "Core 1"
    -D ARDUINO_EVENT_RUNNING_CORE=1          ; Events Run On: "Core 1"
    
    ; USB-Einstellungen (aus deinem Screenshot übernommen)
    -D ARDUINO_USB_CDC_ON_BOOT=0             ; USB CDC On Boot: "Disabled"
    -D ARDUINO_USB_MSC_ON_BOOT=0             ; USB Firmware MSC On Boot: "Disabled"
    -D ARDUINO_USB_DFU_ON_BOOT=0             ; USB DFU On Boot: "Disabled"
    -D ARDUINO_USB_MODE=1                    ; USB Mode: "USB-OTG (TinyUSB)"


